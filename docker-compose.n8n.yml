# Stack n8n autonome - séparée de File2EDI / GenieCommande.
# Usage : docker compose -f docker-compose.n8n.yml up -d
#
# Communication UNIQUEMENT par HTTP :
#   File2EDI  →  POST webhook n8n  (Synchroniser)
#   n8n       →  POST File2EDI /api/masterdata/import + /api/masterdata/reload-cache
#
# Prérequis : API File2EDI déjà up sur le port 8000.
#   docker compose -f docker-compose.dev.yml up -d
#
# Importer : http://localhost:5678 → Import workflow
#   - n8n_masterdata_github_sync.json
#   - n8n_vm_email_to_edifact.json (optionnel)
#   - n8n_vm_status_callback_receiver.json (optionnel)
#
# Webhooks (côté navigateur / config admin) :
#   http://localhost:5678/webhook/masterdata-sync
# Depuis le conteneur API, localhost ne marche pas : utiliser
#   http://host.docker.internal:5678/webhook/masterdata-sync
# (ou laisser MASTERDATA_N8N_WEBHOOK_URL / réécriture auto dans masterdata_n8n.py)

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: geniecommande-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: "localhost"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "http://localhost:5678"

      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: "admin123"

      # Variables lues par les workflows (appels HTTP vers File2EDI)
      # EDIFACT_API_KEY = clé créée dans GenieCommande Admin → Clés API (pas "change-me")
      EDIFACT_API_BASE: "http://host.docker.internal:8000"
      EDIFACT_API_KEY: "${EDIFACT_API_KEY:-}"
      EDIFACT_CALLBACK_URL: "http://host.docker.internal:5678/webhook/f2edi-status"

      GENERIC_TIMEZONE: "Europe/Paris"
      TZ: "Europe/Paris"
      DB_TYPE: "sqlite"

    volumes:
      - geniecommande_n8n_data:/home/node/.n8n
      - ./data/intake:/data/intake:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  geniecommande_n8n_data:
