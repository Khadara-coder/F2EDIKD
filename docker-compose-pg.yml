services:
  postgres:
    image: postgres:15-alpine
    container_name: geniecommande-postgres-tools
    environment:
      POSTGRES_USER: edifact
      POSTGRES_PASSWORD: edifact_dev_password
      POSTGRES_DB: edifact
      POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - edifact_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edifact -d edifact"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edifact

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: geniecommande-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edifact.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edifact

volumes:
  edifact_postgres_data:

networks:
  edifact:
    driver: bridge
