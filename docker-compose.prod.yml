name: geniecommande-prod

services:
  postgres:
    image: postgres:15-alpine
    container_name: geniecommande-prod-postgres
    environment:
      POSTGRES_USER: edifact
      POSTGRES_PASSWORD: edifact_prod_password
      POSTGRES_DB: edifact
    volumes:
      - geniecommande_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edifact -d edifact"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      edifact_prod:
        ipv4_address: 172.25.0.2
    restart: unless-stopped

  file2edi:
    build:
      context: .
      dockerfile: Dockerfile.file2edi
    container_name: geniecommande-prod-file2edi
    ports:
      - "8090:8000"
    env_file:
      - path: .env
        required: false
      - path: .env.vm
        required: false
    environment:
      MOCK_MODE: "${MOCK_MODE:-false}"
      ENABLE_PROFILE_LOGIN: "${ENABLE_PROFILE_LOGIN:-true}"
      APP_REQUIRE_AUTH: "${APP_REQUIRE_AUTH:-true}"
      APP_ADMIN_USERS: "${APP_ADMIN_USERS:-dik1dy@bosch.com,dik1dy,khadara}"
      EDIFACT_PROFILE: "ELM_STANDARD"
      UNB_SENDER_GLN: "4399901876613"
      UNB_RECEIVER_GLN: "3015981600108"
      MASTERDATA_SOURCE_DIR: /app/data/masterdata
      MASTERDATA_RUNTIME_DIR: /app/data/masterdata
      MASTER_DATA_DIR: /app/data/masterdata
      MASTERDATA_AUTO_SYNC: "${MASTERDATA_AUTO_SYNC:-false}"
      MASTERDATA_AUTO_SYNC_INTERVAL_HOURS: "${MASTERDATA_AUTO_SYNC_INTERVAL_HOURS:-24}"
      MASTERDATA_REPO_URL: "${MASTERDATA_REPO_URL:-https://github.boschdevcloud.com/RSR1DY/masterdata.git}"
      MASTERDATA_REPO_BRANCH: "${MASTERDATA_REPO_BRANCH:-main}"
      OUTBOX_DIR: /app/data/outbox
      LOG_DIR: /app/data/logs
      INTAKE_DIR: /app/data/intake
      PG_DATABASE_URL: "postgresql+psycopg://edifact:edifact_prod_password@postgres:5432/edifact"
      FILE2EDI_POSTGRES_STRICT: "true"
      DATABRICKS_SERVER_HOSTNAME: ${DATABRICKS_SERVER_HOSTNAME:-}
      DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      DATABRICKS_CATALOG: ${DATABRICKS_CATALOG:-hive_metastore}
      EDIFACT_CATALOG: ${DATABRICKS_CATALOG:-hive_metastore}
      DATABRICKS_SCHEMA: ${DATABRICKS_SCHEMA:-file2edi}
      EDIFACT_SCHEMA: ${DATABRICKS_SCHEMA:-file2edi}
      DATABRICKS_WAREHOUSE_ID: ${DATABRICKS_WAREHOUSE_ID:-}
      DATABRICKS_PERSIST_PATH: ${DATABRICKS_PERSIST_PATH:-}
      SFTP_ENABLED: "${SFTP_ENABLED:-true}"
      SFTP_HOST: ${SFTP_HOST:-}
      SFTP_PORT: "${SFTP_PORT:-22}"
      SFTP_USERNAME: ${SFTP_USERNAME:-}
      SFTP_PASSWORD: ${SFTP_PASSWORD:-}
      SFTP_PRIVATE_KEY_PATH: ${SFTP_PRIVATE_KEY_PATH:-}
      SFTP_PRIVATE_KEY_PASSPHRASE: ${SFTP_PRIVATE_KEY_PASSPHRASE:-}
      SFTP_REMOTE_DIR: "${SFTP_REMOTE_DIR:-/}"
      SFTP_MAX_RETRIES: "${SFTP_MAX_RETRIES:-3}"
      SAP_RESEND_COOLDOWN_SECONDS: "${SAP_RESEND_COOLDOWN_SECONDS:-300}"
    volumes:
      - geniecommande_prod_file2edi_data:/app/data
      - ./data/masterdata:/app/data/masterdata
      - ./lookups:/app/lookups:ro
      - ./config.ini:/app/config.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health/system"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      edifact_prod:
        ipv4_address: 172.25.0.3

volumes:
  geniecommande_prod_file2edi_data:
    driver: local
  geniecommande_prod_postgres_data:
    driver: local

networks:
  edifact_prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
