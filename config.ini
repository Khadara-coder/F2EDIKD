[paths]
pdf_inbox           = ${INTAKE_DIR}
pdf_processed       = ${INTAKE_DIR}/processed
pdf_error           = ${INTAKE_DIR}/error
local_generated_outbox   = ${OUTBOX_DIR}/local_generated
sftp_submitted_archive   = ${OUTBOX_DIR}/sftp_submitted
sftp_failed_archive      = ${OUTBOX_DIR}/sftp_failed

[n8n]
analyse_existing_project = false
n8n_project_root         =
analysis_report          = docs/N8N_ANALYSIS_REPORT.md

[masterdata]
source_mode      = local_csv
masterdata_root  = ${MASTERDATA_RUNTIME_DIR}
customers_csv    = ${MASTERDATA_RUNTIME_DIR}/10564_Customers.csv
partners_csv     = ${MASTERDATA_RUNTIME_DIR}/10564_Partners.csv
materials_csv    = ${MASTERDATA_RUNTIME_DIR}/10564_Materials.csv
salesorder_csv   = ${MASTERDATA_RUNTIME_DIR}/DB_Salesorder.csv
allow_fallback   = true

[edi]
unb_profile        = ELM_STANDARD
syntax_identifier  = UNOC
syntax_version     = 3
sender_id          = 4399901876613
receiver_id        = 3015981600108
message_type       = ORDERS
directory          = D
version            = 96A
agency             = UN

[sftp]
enabled                    = ${SFTP_ENABLED:-false}
host                       = ${SFTP_HOST}
port                       = 22
username                   = ${SFTP_USERNAME}
password_env               = SFTP_PASSWORD
private_key_path           =
private_key_passphrase_env = SFTP_PRIVATE_KEY_PASSPHRASE
remote_dir                 = ${SFTP_REMOTE_DIR}
upload_tmp_suffix          = .uploading
verify_after_upload        = true
max_retries                = 3
keep_local_copy            = true

[run]
sleep_minutes = 5
dry_run       = false

[logging]
level        = INFO
max_bytes    = 5242880
backup_count = 10

[duplicates]
enabled    = true
ledger_csv = ${DATA_DIR:-/app/data}/duplicate_ledger.csv
