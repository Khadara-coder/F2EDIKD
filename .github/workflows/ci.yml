name: CI

on:
  push:
    branches: ["dev", "staging", "main"]
  pull_request:
    branches: ["dev", "staging", "main"]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    env:
      MOCK_MODE: "true"
      APP_PROFILE_LOGIN_PASSWORD: "ci-password"
      FILE2EDI_POSTGRES_STRICT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-postgres.txt

      - name: Run pytest
        run: python -m pytest tests/ -v

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Verify committed frontend/dist is up to date
        run: |
          if ! git diff --exit-code --ignore-cr-at-eol -- frontend/dist/index.html; then
            echo "frontend/dist/index.html is stale. Run: cd frontend && npm run build && commit dist."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- frontend/dist)
          if [ -n "$untracked" ]; then
            echo "Untracked assets in frontend/dist after build (committed dist is out of date):"
            echo "$untracked"
            exit 1
          fi
